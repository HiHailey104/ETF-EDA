<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버 ETF 분석 리포트</title>
  <style>
    :root{--ink:#162434;--mute:#667686;--line:#dce5ea;--navy:#102b45;--blue:#1179cb;--bg:#f5f8fa;--up:#e14f5a;--down:#167ac4;font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}.page{max-width:1200px;margin:auto;padding:36px 22px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:2px solid var(--navy);padding-bottom:25px}.kicker{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--blue);margin:0 0 10px}h1{font-size:36px;letter-spacing:-.06em;margin:0;color:var(--navy)}.sub,.caption{color:var(--mute);font-size:13px;line-height:1.6}.sub{margin:10px 0 0}.stamp{text-align:right;font-size:12px;color:var(--mute);white-space:nowrap}.stamp b{display:block;color:var(--navy);margin-top:6px}.filters{margin:22px 0;display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:9px}input,select,button{font:inherit}input,select{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:11px;color:var(--ink);outline:0}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #d8edfc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric,.box{background:#fff;border:1px solid var(--line);border-radius:10px}.metric{padding:16px}.metric p{margin:0;color:var(--mute);font-size:12px}.metric strong{display:block;font-size:25px;letter-spacing:-.04em;color:var(--navy);margin-top:12px}.section{margin-top:28px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--mute)}.analysis{display:grid;grid-template-columns:1fr 1fr;gap:11px}.box{padding:17px}.box h2{font-size:15px;margin:0 0 15px;color:var(--navy)}.bar{display:grid;grid-template-columns:110px 1fr 60px;gap:9px;align-items:center;margin:11px 0;font-size:12px}.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:8px;background:#e8eff3;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#1179cb,#68afe6);border-radius:99px}.value{text-align:right;font-weight:700}.table-box{padding:0;overflow:hidden}.table-head{padding:17px}.table-head h2{margin:0;font-size:16px;color:var(--navy)}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;text-align:right;white-space:nowrap}th{background:#f8fafb;color:var(--mute);font-size:11px}th:first-child,th:nth-child(2),th:nth-child(3),td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}.name{font-weight:800;color:var(--navy)}.tag{display:inline-block;background:#eef4f7;color:#506878;border-radius:4px;padding:4px 6px;font-size:10px}.up{color:var(--up)}.down{color:var(--down)}.empty{padding:42px;text-align:center;color:var(--mute)}.error{display:none;margin-top:15px;padding:12px;border-radius:8px;background:#fff0f1;color:#a43a42;font-size:13px}@media(max-width:720px){.page{padding:25px 14px}.top{display:block}.stamp{text-align:left;margin-top:16px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}.analysis{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div><p class="kicker">NAVER FINANCE · ETF REPORT</p><h1>국내 상장 ETF 분석 리포트</h1><p class="sub">운용사·시장·상품 성격으로 분류한 실시간 요약입니다.</p></div><div class="stamp">데이터 기준<b id="time">불러오는 중</b></div></header>
    <section class="filters"><input id="q" type="search" placeholder="ETF 이름 또는 종목코드 검색"><select id="issuer"><option value="">전체 운용사</option></select><select id="market"><option value="">전체 시장</option></select><select id="product"><option value="">전체 상품</option></select></section>
    <section class="grid"><article class="metric"><p>조회 ETF</p><strong id="count">-</strong></article><article class="metric"><p>시가총액 합계</p><strong id="sum">-</strong></article><article class="metric"><p>상승 종목</p><strong class="up" id="up">-</strong></article><article class="metric"><p>평균 3개월 수익률</p><strong id="three">-</strong></article></section>
    <p class="section">구성 분석</p><section class="analysis"><article class="box"><h2>운용사별 시가총액</h2><div id="issuers"></div></article><article class="box"><h2>상품별 종목 수</h2><div id="products"></div></article></section>
    <p class="section">ETF 목록</p><section class="box table-box"><div class="table-head"><h2 id="table-title">분석 결과</h2></div><div class="table-scroll"><table><thead><tr><th>종목명</th><th>운용사</th><th>상품</th><th>현재가</th><th>등락률</th><th>3개월</th><th>시가총액</th></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="empty" hidden>조건에 맞는 ETF가 없습니다.</div></section>
    <p class="caption">출처: 네이버 금융 ETF 목록 API. 운용사·시장·상품은 종목명 키워드를 기준으로 자동 분류한 참고 정보이며 투자 권유가 아닙니다.</p><p id="error" class="error"></p>
  </main>
  <script>
    const api='https://naver-etf-analytics-20261117.todaycode-8480.chatgpt.site/api/etfs', state={all:[]}, nf=new Intl.NumberFormat('ko-KR');
    const n=v=>Number(v)||0, e=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const issuer=name=>{const rules=[['KODEX','삼성자산운용'],['TIGER','미래에셋자산운용'],['RISE','KB자산운용'],['ACE','한국투자신탁운용'],['SOL','신한자산운용'],['HANARO','NH-Amundi자산운용'],['KOSEF','키움투자자산운용'],['TIMEFOLIO','타임폴리오자산운용'],['PLUS','한화자산운용'],['ARIRANG','한화자산운용'],['KBSTAR','KB자산운용']];const x=rules.find(r=>name.startsWith(r[0]));return x?x[1]:'기타 운용사'};
    const market=name=>/(미국|중국|일본|유럽|인도|글로벌|월드|베트남|홍콩|대만|브라질|달러|MSCI|S&P|NASDAQ|나스닥|NYSE|필라델피아|SOX|FTSE|STOXX|항셍)/i.test(name)?'해외':'국내';
    const product=name=>/(레버리지|인버스|곱버스|2X|3X)/i.test(name)?'레버리지·인버스':/(머니마켓|MMF|CD금리|단기채|초단기)/i.test(name)?'현금성·단기':/(채권|국채|국고|회사채|통안|우량채)/i.test(name)?'채권':/(금현물|골드|은선물|원유|WTI|구리|농산물|천연가스)/i.test(name)?'원자재':/(리츠|REITs|부동산)/i.test(name)?'리츠·부동산':/(반도체|AI|2차전지|배터리|바이오|게임|로봇|방산|은행|금융|자동차|조선|헬스케어|전력|친환경)/i.test(name)?'테마·섹터':'주식형';
    const fmtMarket=v=>n(v)>=10000?(n(v)/10000).toFixed(n(v)>=100000?0:1)+'조원':nf.format(n(v))+'억원';
    function select(id,vals,label){const el=document.getElementById(id), old=el.value;el.innerHTML='<option value="">'+label+'</option>'+vals.sort().map(v=>'<option value="'+e(v)+'">'+e(v)+'</option>').join('');el.value=old}
    function groups(items,key,measure){const m={};items.forEach(x=>m[x[key]]=(m[x[key]]||0)+(measure?n(x[measure]):1));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
    function bars(id,data,format){const top=data.slice(0,6),max=top[0]?.[1]||1;document.getElementById(id).innerHTML=top.map(x=>'<div class="bar"><span class="bar-name">'+e(x[0])+'</span><span class="track"><span class="fill" style="width:'+(100*x[1]/max)+'%"></span></span><span class="value">'+format(x[1])+'</span></div>').join('')}
    function render(){const q=document.getElementById('q').value.toLowerCase(), f=['issuer','market','product'].reduce((o,k)=>(o[k]=document.getElementById(k).value,o),{});const items=state.all.filter(x=>(!q||x.itemname.toLowerCase().includes(q)||x.itemcode.includes(q))&&(!f.issuer||x.issuer===f.issuer)&&(!f.market||x.market===f.market)&&(!f.product||x.product===f.product)).sort((a,b)=>n(b.marketSum)-n(a.marketSum));const avg=items.length?items.reduce((s,x)=>s+n(x.threeMonthEarnRate),0)/items.length:0;document.getElementById('count').textContent=nf.format(items.length)+'개';document.getElementById('sum').textContent=fmtMarket(items.reduce((s,x)=>s+n(x.marketSum),0));document.getElementById('up').textContent=nf.format(items.filter(x=>n(x.changeRate)>0).length)+'개';const three=document.getElementById('three');three.textContent=(avg>0?'+':'')+avg.toFixed(2)+'%';three.className=avg>0?'up':avg<0?'down':'';bars('issuers',groups(items,'issuer','marketSum'),fmtMarket);bars('products',groups(items,'product'),v=>nf.format(v)+'개');document.getElementById('table-title').textContent='분석 결과 · '+Math.min(items.length,80)+'개 표시';document.getElementById('rows').innerHTML=items.slice(0,80).map(x=>{const ch=n(x.changeRate),r=n(x.threeMonthEarnRate);return '<tr><td><span class="name">'+e(x.itemname)+'</span><br><span class="caption">'+x.itemcode+'</span></td><td>'+e(x.issuer)+'</td><td><span class="tag">'+e(x.market)+' · '+e(x.product)+'</span></td><td>'+nf.format(n(x.nowVal))+'원</td><td class="'+(ch>0?'up':ch<0?'down':'')+'">'+(ch>0?'+':'')+ch.toFixed(2)+'%</td><td class="'+(r>0?'up':r<0?'down':'')+'">'+(r>0?'+':'')+r.toFixed(2)+'%</td><td>'+fmtMarket(x.marketSum)+'</td></tr>'}).join('');document.getElementById('empty').hidden=!!items.length}
    async function load(){try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('API 응답 오류');const d=await r.json();state.all=d.items.map(x=>Object.assign(x,{issuer:issuer(x.itemname),market:market(x.itemname),product:product(x.itemname)}));select('issuer',[...new Set(state.all.map(x=>x.issuer))],'전체 운용사');select('market',[...new Set(state.all.map(x=>x.market))],'전체 시장');select('product',[...new Set(state.all.map(x=>x.product))],'전체 상품');render();document.getElementById('time').textContent=new Date(d.fetchedAt).toLocaleString('ko-KR')}catch(err){const box=document.getElementById('error');box.style.display='block';box.textContent='데이터를 불러오지 못했습니다. '+err.message}}
    ['q','issuer','market','product'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));load();
  </script>
</body>
</html>
